services:
  # Nginx 反向代理 + 静态文件服务
  nginx:
    image: nginx:alpine
    container_name: toolbox-nginx
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  # Node.js 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: toolbox-backend
    environment:
      - DB_PATH=/app/data/messages.db
      - PORT=3001
    volumes:
      - message-data:/app/data
    restart: unless-stopped

volumes:
  message-data:
    driver: local
